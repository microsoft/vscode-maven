# Test Plan: Maven Archetype Create Project
#
# Covers the archetype project creation path used by issue #1088. The test is
# currently Windows-only because it depends on autotest CLI capabilities that
# have not been published to the macOS/Linux CI jobs yet.
#
# Usage: npx autotest run test-plans/maven-archetype-create-project.yaml

name: "vscode-maven — Archetype Create Project"
description: |
  Drives the Maven quickstart archetype creation wizard through archetype,
  version, groupId, artifactId, and destination folder input, then verifies that
  Maven completes successfully and generates the expected project.
platforms:
  - win32

setup:
  extension: "vscjava.vscode-maven"
  extensions:
    - "redhat.java"
  extensionPath: "../../vscode-maven"
  workspace: "../test/projects/lifecycle-compile"
  vscodeVersion: "stable"
  timeout: 180

steps:
  - id: "wait-java-ls"
    action: "waitForLanguageServer"
    # No `verify:` — `waitForLanguageServer` is itself an assertion
    # (times out if Java LSP never becomes ready). The LSP may cycle
    # back to "Building" for re-indexing between the action returning
    # and the screenshot, which would confuse the LLM judge.
    timeout: 120

  - id: "invoke-create-project"
    action: "run command Maven: New Project..."
    # No `verify:` — invoking the command triggers an asynchronous load
    # of the archetype catalog before the quick-pick appears. The
    # AFTER screenshot may be captured before the quick-pick has
    # painted, leading to flaky LLM downgrades. The next step's
    # `typeInQuickInput` deterministically asserts the quick-pick is
    # present (it would fail if it weren't).
    timeout: 30

  - id: "select-quickstart-archetype"
    action: "typeInQuickInput maven-archetype-quickstart"
    verify: "Quickstart archetype is filtered"
    timeout: 10

  - id: "confirm-quickstart-archetype"
    action: "confirmQuickInput"
    # No `verify:` — same pattern as `confirm-group-id` /
    # `confirm-artifact-id` / `confirm-destination-folder`. Confirming
    # advances to the asynchronously-loaded version quick-pick; the
    # next `select-quickstart-version` step asserts it.
    timeout: 10

  - id: "select-quickstart-version"
    action: "typeInQuickInput 1.4"
    verify: "Quickstart archetype version 1.4 is filtered"
    timeout: 10

  - id: "confirm-quickstart-version"
    action: "confirmQuickInput"
    # No `verify:` — see note on `confirm-quickstart-archetype`. The
    # next `enter-group-id` step asserts the groupId quick-input.
    timeout: 10

  - id: "enter-group-id"
    action: "typeInQuickInput com.microsoft.vscode.maven.autotest"
    verify: "Group ID is entered"
    timeout: 10

  - id: "confirm-group-id"
    action: "confirmQuickInput"

  - id: "enter-artifact-id"
    action: "typeInQuickInput autotest-archetype-demo"
    verify: "Artifact ID is entered"
    timeout: 10

  - id: "confirm-artifact-id"
    action: "confirmQuickInput"

  - id: "enter-destination-folder"
    action: "typeInQuickInput ${workspaceParent}"
    verify: "Workspace parent folder is entered as the destination folder"
    verifyQuickInput:
      noError: true
    timeout: 10

  - id: "confirm-destination-folder"
    action: "confirmQuickInput"
    # No `verify:` — mirrors `confirm-group-id` / `confirm-artifact-id` above.
    # Pressing Enter closes the quick-pick; the archetype wizard then opens a
    # terminal asynchronously. The next step polls the terminal for Maven's
    # deterministic build result.
    timeout: 10

  - id: "wait-for-generation"
    action: "wait 1 second"
    verifyTerminal:
      contains: "BUILD SUCCESS"
      notContains: "BUILD FAILURE"
    timeout: 120

  - id: "verify-generated-pom"
    action: "wait 1 second"
    verifyFile:
      path: "${workspaceParent}/autotest-archetype-demo/pom.xml"
      matches: "(?s)<groupId>com\\.microsoft\\.vscode\\.maven\\.autotest</groupId>.*<artifactId>autotest-archetype-demo</artifactId>.*<version>1\\.0-SNAPSHOT</version>"

  - id: "verify-generated-source"
    action: "wait 1 second"
    verifyFile:
      path: "${workspaceParent}/autotest-archetype-demo/src/main/java/com/microsoft/vscode/maven/autotest/App.java"
      contains: "package com.microsoft.vscode.maven.autotest;"
