name: $(Date:yyyyMMdd).$(Rev:r)
variables:
  - name: Codeql.Enabled
    value: true
  - template: /.azure-pipelines/npm-cfs-variables.yml@self
  - template: /.azure-pipelines/maven-cfs-variables.yml@self
resources:
  repositories:
    - repository: self
      type: git
      ref: refs/heads/main
    - repository: 1esPipelines
      type: git
      name: 1ESPipelineTemplates/1ESPipelineTemplates
      ref: refs/tags/release
trigger:
  branches:
    include:
      - main
# Declared explicitly so the ADO definition picks up a pullRequest trigger and the
# Azure Pipelines GitHub app reports a check on pull requests. Without this the
# definition carries a continuousIntegration trigger only, which is why PRs to this
# repository never showed an ADO check. This has no effect while the definition
# overrides the YAML pull request trigger, so PR validation must also be enabled on
# the definition itself (Triggers -> Pull request validation).
pr:
  branches:
    include:
      - main
  paths:
    include:
      - package.json
      - package-lock.json
      - jdtls.ext/**/pom.xml
      - jdtls.ext/**/com.microsoft.java.maven.tp.target
      - jdtls.ext/.mvn/wrapper/maven-wrapper.properties
      - jdtls.ext/mvnw
      - jdtls.ext/mvnw.cmd
      - .azure-pipelines/ci.yml
      - .azure-pipelines/npm-cfs.yml
      - .azure-pipelines/npm-cfs-variables.yml
      - .azure-pipelines/cfs-settings.xml
      - .azure-pipelines/maven-cfs-variables.yml
extends:
  template: v1/1ES.Unofficial.PipelineTemplate.yml@1esPipelines
  parameters:
    pool:
      os: linux
      name: 1ES_JavaTooling_Pool
      image: 1ES_JavaTooling_Ubuntu-2004
    sdl:
      sourceAnalysisPool:
        name: 1ES_JavaTooling_Pool
        image: 1ES_JavaTooling_Windows_2022
        os: windows
    stages:
      - stage: Build
        jobs:
          - job: CFSValidation
            displayName: Validate dependencies from CFS
            condition: eq(variables['Build.Reason'], 'PullRequest')
            steps:
              - checkout: self
                fetchTags: false
              - bash: |
                  mkdir -p "$(Agent.TempDirectory)/downloadjdk"
                  curl --fail --location --silent --show-error \
                    "https://aka.ms/download-jdk/microsoft-jdk-25-linux-x64.tar.gz" \
                    --output "$(Agent.TempDirectory)/downloadjdk/microsoft-jdk-25-linux-x64.tar.gz"
                displayName: Download JDK 25
              - task: JavaToolInstaller@0
                displayName: Use Java 25
                inputs:
                  versionSpec: "25"
                  jdkArchitectureOption: x64
                  jdkSourceOption: LocalDirectory
                  jdkFile: $(Agent.TempDirectory)/downloadjdk/microsoft-jdk-25-linux-x64.tar.gz
                  jdkDestinationDirectory: $(Agent.ToolsDirectory)/ms-jdk25
              - task: NodeTool@0
                displayName: 'Use Node.js 20.x'
                inputs:
                  versionSpec: '20.x'
              - template: /.azure-pipelines/npm-cfs.yml@self
              - script: npm ci --ignore-scripts --prefer-online --cache "$(Agent.TempDirectory)/npm-cache"
                displayName: Validate npm dependencies from CFS
              - script: ./mvnw -U -Dmaven.repo.local=$(Agent.TempDirectory)/m2/repository -Declipse.p2.mirrors=false -DskipTests package
                displayName: Validate Maven dependencies from CFS
                workingDirectory: $(Build.SourcesDirectory)/jdtls.ext
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  MVNW_PASSWORD: $(System.AccessToken)
          - job: Job_1
            displayName: VSCode-Maven-CI
            condition: ne(variables['Build.Reason'], 'PullRequest')
            templateContext:
              outputs:
                - output: pipelineArtifact
                  artifactName: drop
                  targetPath: $(Build.ArtifactStagingDirectory)
                  displayName: "Publish Artifact: drop"
            steps:
              - checkout: self
                fetchTags: false
              - task: NodeTool@0
                displayName: 'Use Node.js 20.x'
                inputs:
                  versionSpec: '20.x'
              - template: /.azure-pipelines/npm-cfs.yml@self
              - task: CmdLine@2
                displayName: 'npm install'
                inputs:
                  script: npm install
              - script: npm run tslint
                displayName: 'npm run tslint'
              - script: npm run compile
                displayName: 'npm run compile'
              - bash: |
                  mkdir -p "$(Agent.TempDirectory)/downloadjdk"
                  curl --fail --location --silent --show-error \
                    "https://aka.ms/download-jdk/microsoft-jdk-25-linux-x64.tar.gz" \
                    --output "$(Agent.TempDirectory)/downloadjdk/microsoft-jdk-25-linux-x64.tar.gz"
                displayName: Download JDK 25
              - task: JavaToolInstaller@0
                displayName: Use Java 25
                inputs:
                  versionSpec: "25"
                  jdkArchitectureOption: x64
                  jdkSourceOption: LocalDirectory
                  jdkFile: $(Agent.TempDirectory)/downloadjdk/microsoft-jdk-25-linux-x64.tar.gz
                  jdkDestinationDirectory: $(Agent.ToolsDirectory)/ms-jdk25
              - script: npm run build-plugin
                displayName: 'npm run build-plugin'
                # System.AccessToken is a secret, and Azure Pipelines does not export secret
                # variables to the environment -- not even through a variable that merely
                # references one. It is mapped here, on the step that actually runs Maven,
                # rather than in maven-cfs-variables.yml alongside the rest of the wiring.
                env:
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  MVNW_PASSWORD: $(System.AccessToken)
              - script: 'npx @vscode/vsce@latest package'
                displayName: 'package vsix'
              - task: CopyFiles@2
                displayName: 'Copy Files to: $(Build.ArtifactStagingDirectory)'
                inputs:
                  Contents: '*.vsix'
                  TargetFolder: '$(Build.ArtifactStagingDirectory)'
